<svg xmlns="http://www.w3.org/2000/svg" width="400" height="202" viewBox="0 0 400 202" role="img" aria-labelledby="title desc">
  <title id="title">Compute-matched post-training</title>
  <desc id="desc">At about 1.38 H100 GPU-hours per run, GRPO beat continued SFT on GSM8K. The original model still scored highest in this single-seed experiment. +7.1 percentage points.</desc>
  <defs><style>@font-face{font-family:'f1';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'f2';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'f3';src:url(data:font/woff2;base64,) format('woff2')}</style></defs>
  <rect width="400" height="202" rx="9" fill="#F2F4F6"/>
  <text x="22" y="38" text-anchor="start" fill="#15181D" font-family="f3, Arial, sans-serif" font-size="25">LLM post-training</text>
  <path transform="translate(367 24)" d="M0 10 10 0 M2 0h8v8" fill="none" stroke="#424E98" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="22" y="82" text-anchor="start" fill="#424E98" font-family="f3, Arial, sans-serif" font-size="32">+7.1</text>
  <text x="100" y="81" text-anchor="start" fill="#47515C" font-family="f1, Arial, sans-serif" font-size="17">percentage points</text>
  <text x="22" y="122" text-anchor="start" fill="#47515C" font-family="f1, Arial, sans-serif" font-size="18">On GSM8K, GRPO beat continued SFT at</text>
  <text x="22" y="146" text-anchor="start" fill="#47515C" font-family="f1, Arial, sans-serif" font-size="18">about 1.38 H100 GPU-hours per run. The</text>
  <text x="22" y="170" text-anchor="start" fill="#47515C" font-family="f1, Arial, sans-serif" font-size="18">original model still scored highest.</text>
</svg>
